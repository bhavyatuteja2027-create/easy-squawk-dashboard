name: update-feed
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: Commit feed
        run: |
          git config user.name "easy-squawk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet || (git commit -m "update feed" && git push)
